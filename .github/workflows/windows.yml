name: Windows 回归

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-2022
    defaults:
      run:
        shell: powershell
    steps:
      - name: 获取源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 编译辅助 DLL
        run: .\Build.ps1
      - name: 运行隔离回归并输出脱敏摘要
        run: .\.github\scripts\Run-CI.ps1
